<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NutriTrack AI</title>
    <!-- Link to our new CSS file -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .stats-card {
            background-color: #f8fcf8;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .stats-card p {
            margin: 0.5rem 0;
            font-size: 1.1rem;
        }
        .bmi-value {
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 1rem 0 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dashboard</h1>
        <p class="subtitle">Welcome {{ name }}</p>
        
        <div class="stats-card">
            <p><strong>Your Age:</strong> {{ age }}</p>
            <p><strong>Your BMI</strong></p>
            <p class="bmi-value">{{ bmi }}</p>
            <p><strong>Category:</strong> {{ category }}</p>
        </div>

        <div style="text-align: center;">
            <a href="/logout" style="color: #d32f2f; font-weight: bold;">Log Out</a>
        </div>
    </div>
</body>
</html>
