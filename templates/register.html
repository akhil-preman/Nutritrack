<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NutriTrack AI</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1c1c1e;
            --card-bg-light: #2c2c2e;
            --primary-color: #c4f042;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
            --border-color: #2c2c2e;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; color: var(--text-main); }
        
        /* Navbar (Matches Inside Pages) */
        .navbar { display: flex; justify-content: space-between; align-items: center; height: 80px; padding: 0 3rem; box-sizing: border-box; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .nav-brand { font-size: 1.5rem; font-weight: 700; color: var(--primary-color); display: flex; align-items: center; gap: 8px; text-decoration: none; }
        .nav-links { display: flex; align-items: center; gap: 2rem; font-size: 1rem; font-weight: 500; }
        .nav-links a { color: var(--text-main); text-decoration: none; transition: color 0.2s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary-color); }

        .container { max-width: 600px; margin: 4rem auto; padding: 0 1.5rem; }
        
        .content-box { background: var(--card-bg); border-radius: 24px; padding: 3rem; border: 1px solid var(--border-color); }

        .header { text-align: center; margin-bottom: 2.5rem; }
        .header h1 { font-size: 2rem; margin: 0 0 10px 0; color: var(--primary-color); }
        .header p { color: var(--text-muted); font-size: 1rem; margin: 0; }

        .flashes { list-style: none; padding: 0; margin: 0 0 2rem 0; text-align: center; }
        .flashes li { background: rgba(244, 63, 94, 0.1); color: #f43f5e; padding: 1rem; border-radius: 12px; font-size: 1rem; border: 1px solid rgba(244, 63, 94, 0.2); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.95rem; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 1.2rem; background: var(--card-bg-light); border: 1px solid transparent; border-radius: 16px; color: white; font-size: 1rem; box-sizing: border-box; outline: none; transition: border 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary-color); background: rgba(196, 240, 66, 0.05); }
        
        .btn-submit { width: 100%; padding: 1.2rem; background: var(--primary-color); color: #000; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: transform 0.2s; margin-top: 1rem; }
        .btn-submit:hover { transform: scale(1.02); }

        .auth-links { text-align: center; margin-top: 2rem; font-size: 0.95rem; color: var(--text-muted); }
        .auth-links a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
        .auth-links a:hover { text-decoration: underline; }

        .form-group select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%238e8e93%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 1.2rem top 50%;
            background-size: 0.8rem auto;
            cursor: pointer;
        }
        .form-group select option { background: var(--card-bg-light); color: var(--text-main); }

    </style>
</head>
<body>
    <nav class="navbar">
        <a href="/" class="nav-brand">NutriTrack AI</a>
        <div class="nav-links">
            <a href="/login">Login</a>
            <a href="/register" class="active">Register</a>
        </div>
    </nav>

    <div class="container">
        <div class="content-box">
            <div class="header">
                <h1>Create Account</h1>
                <p>Join NutriTrack and start tracking your meals</p>
            </div>

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <ul class="flashes">
                {% for message in messages %}
                  <li>{{ message }}</li>
                {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}

            <form method="POST" action="/register">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required autofocus>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required minlength="6">
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label for="age">Age</label>
                        <input type="number" id="age" name="age" required min="10" max="100">
                    </div>
                    
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender" required>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="weight">Weight (kg)</label>
                        <input type="number" id="weight" name="weight" step="0.1" required>
                    </div>

                    <div class="form-group">
                        <label for="height">Height (cm)</label>
                        <input type="number" id="height" name="height" step="0.1" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="goal">Primary Fitness Goal</label>
                    <select id="goal" name="goal" required>
                        <option value="cut">Cut Weight (Calorie Deficit)</option>
                        <option value="maintain" selected>Maintain Weight</option>
                        <option value="gain">Gain Muscle (Calorie Surplus)</option>
                    </select>
                </div>

                <button type="submit" class="btn-submit">Register Account</button>
            </form>

            <div class="auth-links">
                Already have an account? <a href="/login">Log in here</a>
            </div>
        </div>
    </div>
</body>
</html>
