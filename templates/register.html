<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - NutriTrack AI</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1c1c1e;
            --input-bg: #2c2c2e;
            --primary-color: #c4f042;
            --text-main: #ffffff;
            --text-muted: #8e8e93;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 2rem 0; color: var(--text-main); display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        
        .auth-container { background: var(--card-bg); width: 100%; max-width: 450px; padding: 3rem 2.5rem; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid var(--input-bg); box-sizing: border-box; margin: auto; }
        
        .brand { text-align: center; margin-bottom: 2.5rem; }
        .brand h1 { font-size: 2rem; color: var(--primary-color); margin: 0 0 8px 0; font-weight: 700; }
        .brand p { color: var(--text-muted); margin: 0; font-size: 0.95rem; }

        .flashes { list-style: none; padding: 0; margin: 0 0 1.5rem 0; }
        .flashes li { background: rgba(244, 63, 94, 0.1); color: #f43f5e; padding: 1rem; border-radius: 12px; font-size: 0.9rem; text-align: center; border: 1px solid rgba(244, 63, 94, 0.2); }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 1rem; background: var(--input-bg); border: 1px solid transparent; border-radius: 12px; color: white; font-size: 1rem; box-sizing: border-box; outline: none; transition: border 0.2s; }
        .form-group input:focus, .form-group select:focus { border-color: var(--primary-color); }
        
        .row { display: flex; gap: 1rem; }
        .row .form-group { flex: 1; }

        .btn-submit { width: 100%; padding: 1.2rem; background: var(--primary-color); color: #000; border: none; border-radius: 16px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: transform 0.2s; margin-top: 1rem; }
        .btn-submit:hover { transform: scale(1.02); }

        .auth-links { text-align: center; margin-top: 2rem; font-size: 0.9rem; color: var(--text-muted); }
        .auth-links a { color: var(--primary-color); text-decoration: none; font-weight: 600; }
        .auth-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="brand">
            <h1>NutriTrack AI</h1>
            <p>Create your account</p>
        </div>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <ul class="flashes">
            {% for message in messages %}
              <li>{{ message }}</li>
            {% endfor %}
            </ul>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/register">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" name="age" required>
            </div>

            <div class="row">
                <div class="form-group">
                    <label for="height_cm">Height (cm)</label>
                    <input type="number" step="0.1" id="height_cm" name="height_cm" required>
                </div>
                <div class="form-group">
                    <label for="weight_kg">Weight (kg)</label>
                    <input type="number" step="0.1" id="weight_kg" name="weight_kg" required>
                </div>
            </div>

            <div class="form-group">
                <label for="goal">Fitness Goal</label>
                <select id="goal" name="goal" required style="width: 100%; padding: 1rem; background: var(--input-bg); border: 1px solid transparent; border-radius: 12px; color: white; font-size: 1rem; outline: none; transition: border 0.2s;">
                    <option value="cut">Cut Weight (-500 kcal)</option>
                    <option value="maintain" selected>Maintain Weight</option>
                    <option value="gain">Gain Weight (+500 kcal)</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Create Account</button>
        </form>
        
        <div class="auth-links">
            Already have an account? <a href="/login">Log in here</a>
        </div>
    </div>
</body>
</html>
